<!-- USWDS Basic Header & Navigation -->
<header class="usa-header usa-header--basic" [class.usa-is-mobile-nav-open]="isMobileNavOpen" role="banner">  <div class="usa-nav-container">
    
    <!-- Navbar Brand / Logo & Mobile Menu Toggle -->
    <div class="usa-navbar">
      <div class="usa-logo" id="ag-brand">
        <em class="usa-logo__text">
          <a routerLink="mission" title="Home" aria-label="Foreign Service Prep Home">
            <img src="./assets/art.png" width="180px" id="ag" alt="Foreign Service Prep logo">
          </a>
        </em>
      </div>
      <button type="button" class="usa-menu-btn" aria-label="Open mobile menu">Menu</button>
    </div>

    <!-- Primary Navigation Links & Sliding Drawer Panel -->
    <nav aria-label="Primary navigation" class="usa-nav">
      <div class="usa-nav__inner">
        <button type="button" class="usa-nav__close" aria-label="Close mobile menu">
          <span aria-hidden="true">&times;</span>
        </button>
        
        <ul class="usa-nav__primary usa-accordion">
          <li class="usa-nav__primary-item">
            <a class="usa-nav__link" routerLink="mathstat"><span>Math + Statistics</span></a>
          </li>
          <li class="usa-nav__primary-item">
            <a class="usa-nav__link" routerLink="stratcomm"><span>Communication + Writing</span></a>
          </li>
          <li class="usa-nav__primary-item">
            <a class="usa-nav__link" routerLink="usworldeconomy"><span>US + World Economy</span></a>
          </li>
          <li class="usa-nav__primary-item">
            <a class="usa-nav__link" routerLink="govhistory"><span>Government + History</span></a>
          </li>
          <li class="usa-nav__primary-item">
            <a class="usa-nav__link" routerLink="settings" aria-label="Settings">
              <span class="material-symbols-outlined" aria-hidden="true">settings</span>
            </a>
          </li>
        </ul>
      </div>
    </nav>

  </div>
</header>

<!-- Router Outlet -->
<main id="main-content">
  <router-outlet></router-outlet>
</main>

<!-- USWDS Slim Footer -->
<footer class="usa-footer usa-footer--slim" role="contentinfo">
  <div class="usa-footer__secondary-section">
    <div class="grid-container">
      <div class="usa-footer__logo grid-row">
        <div class="grid-col-auto">
          <p class="usa-footer__logo-heading font-sans-3xs">
            Copyright © 2026 ForeignServicePrep ~ Join the US State Department
          </p>
        </div>
      </div>
    </div>
  </div>
</footer>
